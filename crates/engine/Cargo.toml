[package]
name = "torno-engine"
description = "Torno engine: the session, the command registry (everything is a command), undo/redo and selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["plugins"]
plugins = ["dep:craft-plugin-wasm"]
# Optional authored texture/HDR bytes; the command registry and metadata remain available.
bundled-render-library = []
raytrace-cpu = ["torno-render/raytrace-cpu"]
# Turns on the parameter-contract audit recorder (`TORNO_PARAM_AUDIT`, see
# `src/schema/record.rs`), for checking a new contract against the whole test suite.
param-audit = []
solver-profiling = ["torno-sketch/solver-profiling"]
# Compile the profiler in (torno-profile/enabled): every app turns it on by default, so any
# build can be profiled; it records only once switched on (TORNO_PROFILE=1, the CLI's
# --profile, the app's preference, diagnostics.profile).
profile = ["torno-profile/enabled"]

[[example]]
name = "sketch_analysis_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_drag_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_target_bench"
required-features = ["solver-profiling"]

[dependencies]
craft-plugin = { workspace = true }
torno-viewport = { workspace = true }
# The printed look of an inserted circuit board (src/cmd/board_layers.rs): its layers drawn
# into an image; both already in the tree (ui-egui, render).
tiny-skia = { workspace = true }
png = { workspace = true }
solidcore-ops = { workspace = true }
solidcore-record = { workspace = true }
torno-color = { workspace = true }
torno-control = { workspace = true }
torno-geom = { workspace = true }
torno-sketch = { workspace = true }
torno-kernel = { workspace = true }
torno-doc = { workspace = true }
torno-io = { workspace = true }
torno-render = { workspace = true }
torno-profile = { workspace = true }
torno-ui-text = { workspace = true }
# reference pictures for inspect.compare_picture (PNG and JPEG decode, PNG encode)
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml_edit = "0.25"
schemars = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
solidcore-ops = { workspace = true }
torno-profile = { workspace = true, features = ["enabled"] }
# Model-cache tests also run in a source tarball build (no git commit).
torno-io = { workspace = true, features = ["dxf-legacy-baseline-tests", "trust-unknown-source"] }
# Normal CI exercises profiling assertions without enabling the production feature.
torno-sketch = { workspace = true, features = ["solver-profiling"] }

[[example]]
name = "render_resource_workflow"
required-features = ["raytrace-cpu"]

[[example]]
name = "wood_texture_workflow"
required-features = ["raytrace-cpu"]

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
# Component-model sandbox; no WASI, cache deserialization, network or process imports.
craft-plugin-wasm = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wat = "1"
